name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write  # Required to create a release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Path to your keystore in the repo. Adjust if it's elsewhere.
      KEYSTORE_PATH: app/debug.keystore
      # If your custom debug.keystore uses default debug creds, these can be 'android' and 'androiddebugkey'.
      # If they are different, store them in GitHub Secrets and reference them here.
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify keystore exists
        run: |
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Keystore not found at $KEYSTORE_PATH"
            exit 1
          fi
          echo "Keystore found at $KEYSTORE_PATH"

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Build signed RELEASE APK
        # The android.injected.signing.* properties instruct Gradle to sign the release build
        run: |
          ./gradlew \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Create a new tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch --tags
          TAG="v1.0.${{ github.run_number }}"
          # Uncomment to actually create & push the tag:
          # git tag "$TAG"
          # git push origin "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        if: contains(github.event.head_commit.message, 'release')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}